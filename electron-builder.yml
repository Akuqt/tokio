appId: com.ialfaro.tokio
productName: Tokio
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
# NOTE: Required by the AGPL-3.0/LGPL-3.0 notices in THIRD_PARTY_NOTICES.md, keep these in the installed app.
extraResources:
  - from: LICENSE
    to: licenses/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: LICENSES
    to: licenses/LICENSES
win:
  executableName: tokio
  icon: "build/icon.png"
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  runAfterFinish: false
npmRebuild: false
publish:
  provider: generic
  url: https://tokio.ialfaro.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
