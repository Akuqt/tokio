[package]
name = "tokio-installer"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Downloads and installs the Tokio app."
repository = "https://github.com/Akuqt/tokio"
publish = false
build = "build.rs"

[[bin]]
name = "tokio"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
wry = "0.57"

[build-dependencies]
serde_json = "1"
winresource = "0.1"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
