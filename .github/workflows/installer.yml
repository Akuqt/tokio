name: Installer

# Builds the installer for each system. Runs on its own when the installer changes, and is called by
# release.yml for the release assets.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/installer/**"
      - "scripts/installer/**"
      - ".github/workflows/installer.yml"
  pull_request:
    paths:
      - "src/installer/**"
      - "scripts/installer/**"
      - ".github/workflows/installer.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: mac-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: mac-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy --target ${{ matrix.target }}

      - name: Install packages
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build installer
        run: yarn build:installer
        env:
          INSTALLER_TARGET: ${{ matrix.target }}

      - name: Lint installer
        run: cargo clippy --manifest-path src/installer/Cargo.toml --target ${{ matrix.target }} -- -D warnings

      # Release names. Archives keep the macOS bundle and the Linux binary executable.
      - name: Package
        shell: bash
        run: |
          mkdir -p release
          name="Tokio-Installer-${{ matrix.name }}"
          case "$RUNNER_OS" in
            Windows) cp installer-out/tokio.exe "release/$name.exe" ;;
            macOS) ditto -c -k --keepParent "installer-out/Tokio Installer.app" "release/$name.zip" ;;
            Linux) tar -czf "release/$name.tar.gz" -C installer-out tokio-installer ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          if-no-files-found: error
          path: release/*
