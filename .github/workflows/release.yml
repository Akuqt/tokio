name: Release

# Push a tag v<version> matching package.json to build every platform and the installers into a
# draft GitHub release. Publish the draft to make it the latest release, which the installer and
# auto-updates read.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi

  app:
    needs: verify
    uses: ./.github/workflows/build-app.yml

  installer:
    needs: verify
    uses: ./.github/workflows/installer.yml

  release:
    needs: [app, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* --draft --verify-tag \
              --title "Tokio ${GITHUB_REF_NAME#v}" --generate-notes
          fi
